p12 = (159, 441)

l(p0, p3)
l(p0, p4)
l(p1, p5)
l(p1, p10)
l(p2, p11)
l(p3, p7)
l(p4, p6)
l(p5, p11)
l(p6, p9)
l(p8, p12)
l(p11, p12)

	-->
