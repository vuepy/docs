<svg xmlns="http://www.w3.org/2000/svg"
     style="background-color: transparent;"
     viewBox="0 0 500 500"
>
	<defs>
		<style><![CDATA[
		.line {
			stroke: #008c8c;
			fill-opacity: 0.8;
			stroke-opacity: 1;
			stroke-width: 5;
		}
		.line-polygon {
			stroke: #008c8c;
			fill: #008c8c;
			fill-opacity: 0.3;
			stroke-opacity: 1;
			stroke-width: 5;
		}
		]]></style>
	</defs>
	<!--
def l(p1, p2):
  print(f'<line x1="{p1[0]}" y1="{p1[1]}" x2="{p2[0]}" y2="{p2[1]}" class="line"/>')

def polygon(*points):
  print(f'<polygon points="{" ".join(f"{p[0]},{p[1]}" for p in points)}" class="line-polygon"/>')


polygon(p0, p3, p7, p11, p12, p8, p5, p4)

p0 = (0, 0)
p1 = (100, 0)
